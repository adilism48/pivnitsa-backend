services:
  postgres:
    image: postgres:17-alpine
    container_name: pivnitsa-postgres
    environment:
      POSTGRES_DB: pivnitsa
      POSTGRES_USER: pivnitsa
      POSTGRES_PASSWORD: pivnitsa
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pivnitsa -d pivnitsa"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    container_name: pivnitsa-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pivnitsa
      DB_USERNAME: pivnitsa
      DB_PASSWORD: pivnitsa
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
