services:
  postgres:
    image: postgres:17-alpine
    container_name: pivnitsa-postgres
    environment:
      POSTGRES_DB: pivnitsa
      POSTGRES_USER: pivnitsa
      POSTGRES_PASSWORD: pivnitsa
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - app-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pivnitsa -d pivnitsa" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - app-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage_s3
    restart: unless-stopped
    entrypoint: [ "/garage" ]
    command: [ "server", "--single-node", "--default-bucket" ]
    environment:
      - GARAGE_DEFAULT_ACCESS_KEY=${S3_ACCESS_KEY:-GK1234567890abcdef12345678}
      - GARAGE_DEFAULT_SECRET_KEY=${S3_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - GARAGE_DEFAULT_BUCKET=${S3_BUCKET_NAME:-pivnitsa-media-local}
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:-1799bccfd7411eddcf9ebd316bc1f5287ad12a68094e1c6ac6abde7e6feae1ec}
      - GARAGE_ADMIN_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN:-admin-secret-token}
      - GARAGE_S3_API_ROOT_DOMAIN=${GARAGE_ROOT_DOMAIN:-localhost}
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3902:3902"
    networks:
      - app-network
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: [ "CMD", "/garage", "status" ]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    environment:
       - DOMAIN=${DOMAIN:-localhost}
       - MEDIA_DOMAIN=${MEDIA_DOMAIN:-pivnitsa-media-local}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - app-network
    volumes:
      - ./conf:/etc/caddy
      - caddy-data:/data
      - caddy-config:/config

  backend:
    build: .
    image: pivnitsa-backend:latest
    container_name: pivnitsa-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pivnitsa
      DB_USERNAME: pivnitsa
      DB_PASSWORD: pivnitsa
      JWT_SECRET: ${JWT_SECRET}
      NIKITA_OTP_ENABLED: ${NIKITA_OTP_ENABLED:-false}
      NIKITA_LOGIN: ${NIKITA_LOGIN}
      NIKITA_PASSWORD: ${NIKITA_PASSWORD}
      NIKITA_SENDER: ${NIKITA_SENDER}
      INFOBIP_OTP_ENABLED: ${INFOBIP_OTP_ENABLED:-false}
      INFOBIP_BASE_URL: ${INFOBIP_BASE_URL}
      INFOBIP_API_KEY: ${INFOBIP_API_KEY}
      INFOBIP_SENDER: ${INFOBIP_SENDER}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-pivnitsa-media-local}
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-GK1234567890abcdef12345678}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://pivnitsa-media-local.localhost:3902}
      INITIAL_OWNER_EMAIL: ${INITIAL_OWNER_EMAIL:-owner@pivnitsa.local}
      INITIAL_OWNER_PASSWORD: ${INITIAL_OWNER_PASSWORD:-ChangeMe123}
      INITIAL_OWNER_FULL_NAME: ${INITIAL_OWNER_FULL_NAME:-Владелец}
      MOBILE_CANONICAL_URL: ${MOBILE_CANONICAL_URL:-https://localhost/events/}
      MOBILE_DEEP_LINK_PREFIX: ${MOBILE_DEEP_LINK_PREFIX:-app://}
      MOBILE_IOS_STORE: ${MOBILE_IOS_STORE:-https://apps.apple.com/app/youtube/id544007664}
      MOBILE_ANDROID_STORE: ${MOBILE_ANDROID_STORE:-https://play.google.com/store/apps/details?id=com.google.android.youtube}
      FIREBASE_CONFIG_PATH: file:/app/secrets/firebase-service-account.json
    volumes:
      - ./firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  garage-meta:
  garage-data:
  caddy-data:
  caddy-config: