services:
  postgres:
    image: postgres:17-alpine
    container_name: pivnitsa-postgres
    environment:
      POSTGRES_DB: pivnitsa
      POSTGRES_USER: pivnitsa
      POSTGRES_PASSWORD: pivnitsa
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pivnitsa -d pivnitsa"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  backend:
    build: .
    container_name: pivnitsa-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pivnitsa
      DB_USERNAME: pivnitsa
      DB_PASSWORD: pivnitsa
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      NIKITA_OTP_ENABLED: ${NIKITA_OTP_ENABLED:-false}
      NIKITA_LOGIN: ${NIKITA_LOGIN}
      NIKITA_PASSWORD: ${NIKITA_PASSWORD}
      NIKITA_SENDER: ${NIKITA_SENDER}
      INFOBIP_OTP_ENABLED: ${INFOBIP_OTP_ENABLED:-false}
      INFOBIP_BASE_URL: ${INFOBIP_BASE_URL}
      INFOBIP_API_KEY: ${INFOBIP_API_KEY}
      INFOBIP_SENDER: ${INFOBIP_SENDER}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data: